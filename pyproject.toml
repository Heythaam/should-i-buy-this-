[project]
name = "should-i-buy-this"
version = "0.1.0"
description = "Paste an Amazon product URL, get a grounded Buy/Skip/Wait verdict."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic~=2.13",
    "pydantic-settings>=2.6",
    "playwright~=1.62",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff~=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
