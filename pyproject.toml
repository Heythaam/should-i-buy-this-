[project]
name = "should-i-buy-this"
version = "0.1.0"
description = "Paste an Amazon product URL, get a grounded Buy/Skip/Wait verdict."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic~=2.13",
    "pydantic-settings>=2.6",
    "playwright~=1.62",
    "beautifulsoup4>=4.12",
    "openai>=3.39.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.47",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff~=0.16",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern (`Depends(...)` as a parameter
# default) is intentional, not the mutable-default-argument bug B008 flags --
# https://docs.astral.sh/ruff/rules/function-call-in-default-argument/
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
